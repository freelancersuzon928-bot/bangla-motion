<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাংলা মোশন টেক্সট ভিডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0b0f1a; color:#e5e7eb; font-family:'Noto Sans Bengali',sans-serif; padding:16px; }

  .controls { max-width:900px; margin:0 auto; display:grid; gap:10px; }
  textarea { width:100%; height:200px; background:#111827; color:#f8fafc; border:1px solid #334155; border-radius:8px; padding:10px; font-family:inherit; font-size:15px; line-height:1.7; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button, select { background:#1e293b; color:#f8fafc; border:1px solid #334155; border-radius:8px; padding:8px 14px; font-family:inherit; font-size:14px; cursor:pointer; }
  button:hover, select:hover { border-color:#22d3ee; }
  button.primary { background:#0891b2; border-color:#0891b2; }
  .hint { font-size:13px; color:#94a3b8; line-height:1.6; }
  .status { font-size:14px; color:#94a3b8; min-height:20px; }

  .stage-wrap { display:flex; justify-content:center; margin:20px 0 40px; }
  #stage { position:relative; overflow:hidden; border-radius:14px; box-shadow:0 0 0 1px #334155, 0 20px 60px rgba(0,0,0,.5); }
  #stage.vertical { width:360px; height:640px; }
  #stage.horizontal { width:854px; height:480px; max-width:100%; }

  .bg { position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, #13233d 0%, #070b14 70%); }
  .orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; animation:float 14s ease-in-out infinite alternate; }
  .o1 { width:260px; height:260px; background:#0891b2; top:-70px; left:-70px; }
  .o2 { width:300px; height:300px; background:#7c3aed; bottom:-90px; right:-90px; animation-delay:-7s; }
  @keyframes float { to { transform:translate(40px,30px) scale(1.1); } }

  .grid { position:absolute; inset:0; background-image:linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px); background-size:40px 40px; }

  #progress { position:absolute; top:0; left:0; height:4px; width:0; background:linear-gradient(90deg,#22d3ee,#facc15); z-index:5; }
  #counter { position:absolute; bottom:12px; right:14px; font-size:12px; color:#64748b; z-index:5; }

  .scene { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:40px 30px; text-align:center; z-index:2; pointer-events:none;
    opacity:0; transform:translateY(30px) scale(.96); filter:blur(6px);
    transition:opacity .6s ease, transform .7s cubic-bezier(.2,.8,.2,1), filter .6s ease; }
  .scene.active { opacity:1; transform:none; filter:none; }

  .box { display:flex; flex-direction:column; align-items:center; max-width:100%; }
  .bar { display:block; height:4px; width:0; margin-bottom:20px; border-radius:2px; background:linear-gradient(90deg,#22d3ee,#facc15);
    transition:width .8s ease .35s; }
  .scene.active .bar { width:70px; }

  .txt { font-weight:700; line-height:1.85; color:#f8fafc; font-size:30px; text-shadow:0 2px 14px rgba(0,0,0,.7); }
  #stage.horizontal .txt { font-size:38px; }

  .txt em { font-style:normal; font-weight:900; color:#facc15; }
  .scene.active .txt em { animation:glow 1.8s ease-in-out infinite alternate; }
  @keyframes glow {
    from { text-shadow:0 0 4px rgba(250,204,21,.15); }
    to   { text-shadow:0 0 18px rgba(250,204,21,.85); }
  }
</style>
</head>
<body>

<div class="controls">
  <textarea id="script">আজ আমি তোমাদের একটা গল্প বলব
একটা ছোট্ট গ্রামে বাস করত এক কিশোর
তার স্বপ্ন ছিল <em>বড় হয়ে কিছু করার</em>
কিন্তু পথটা ছিল কঠিন
তবু সে হাল ছাড়েনি
প্রতিদিন সে একটু একটু করে এগিয়েছে
আর একদিন, সে নিজের স্বপ্ন ছুঁয়ে ফেলল
মনে রেখো, চেষ্টা কখনো বৃথা যায় না</textarea>

  <div class="hint">
    প্রতি লাইনে আলাদা করে লেখো। সময় লিখতে চাইলে লাইনের শুরুতে <b>সেকেন্ড|</b> দাও, যেমন <b>4|একটা ছোট্ট গ্রাম</b>। সময় না দিলে লেখার দৈর্ঘ্য অনুযায়ী নিজে থেকে সময় ঠিক হবে। কোনো শব্দ হাইলাইট করতে <b>&lt;em&gt;...&lt;/em&gt;</b> দিয়ে মোড়ো।
  </div>

  <div class="row">
    <label>ফরম্যাট:
      <select id="format">
        <option value="vertical">9:16 (Reels/Shorts)</option>
        <option value="horizontal">16:9 (ল্যান্ডস্কেপ)</option>
      </select>
    </label>
    <label>ভয়েস ফাইল: <input type="file" id="audio" accept="audio/*"></label>
  </div>

  <div class="row">
    <button id="play" class="primary">▶ চালাও</button>
    <button id="rec">⏺ রেকর্ড শুরু</button>
    <button id="stop">⏹ থামাও</button>
  </div>

  <div class="status" id="status">লেখা দাও, ভয়েস ফাইল দাও, তারপর চালাও।</div>
</div>

<div class="stage-wrap">
  <div id="stage" class="vertical">
    <div class="bg"></div>
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="grid"></div>
    <div id="progress"></div>
    <div id="counter"></div>
  </div>
</div>

<audio id="player"></audio>

<script>
const LINE_CHARS_PER_SEC = 11;   // বাংলা লেখা পড়ার গড় গতি (অক্ষর/সেকেন্ড)
const MIN_LINE_SEC = 3;          // প্রতিটি লাইন অন্তত এতক্ষণ থাকবে
const FADE_OUT_SEC = 0.4;        // শেষ হওয়ার আগে ফেড-আউটের সময়

const stage = document.getElementById('stage');
const formatSel = document.getElementById('format');
const scriptEl = document.getElementById('script');
const audioInput = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('play');
const recBtn = document.getElementById('rec');
const stopBtn = document.getElementById('stop');
const statusEl = document.getElementById('status');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');

let items = [], total = 0, startTime = 0, rafId = null;
let recorder = null, chunks = [], screenStream = null;

function escapeHtml(text) {
  return text.replace(/</g, '&lt;').replace(/&lt;(\/?)em&gt;/g, '<$1em>');
}

function plainLength(html) {
  return html.replace(/<[^>]+>/g, '').replace(/\s/g, '').length;
}

function parseScript() {
  const raw = scriptEl.value.split('\n').map(l => l.trim()).filter(Boolean);
  const list = [];
  let cursor = 0;

  raw.forEach(line => {
    let explicitT = null, text = line;
    const bar = line.indexOf('|');
    if (bar > -1) {
      const n = parseFloat(line.slice(0, bar));
      if (!isNaN(n)) { explicitT = n; text = line.slice(bar + 1); }
    }
    if (explicitT !== null) cursor = explicitT;

    const html = escapeHtml(text.trim());
    const auto = Math.max(MIN_LINE_SEC, plainLength(html) / LINE_CHARS_PER_SEC + 1);
    list.push({ t: cursor, auto, html });
    cursor += auto;
  });

  list.forEach((it, i) => {
    const next = list[i + 1];
    it.dur = (next && next.t > it.t) ? Math.max(1.5, next.t - it.t) : it.auto;
  });
  return list;
}

function buildScenes() {
  stage.querySelectorAll('.scene').forEach(s => s.remove());
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'scene';
    div.innerHTML = '<div class="box"><span class="bar"></span><div class="txt">' + it.html + '</div></div>';
    stage.insertBefore(div, progress);
  });
}

function setFormat() {
  stage.className = formatSel.value;
}
formatSel.addEventListener('change', setFormat);
setFormat();

audioInput.addEventListener('change', () => {
  if (audioInput.files[0]) {
    player.src = URL.createObjectURL(audioInput.files[0]);
    statusEl.textContent = 'ভয়েস যুক্ত হয়েছে। এখন চালাও বা রেকর্ড করো।';
  }
});

function render(time) {
  const scenes = stage.querySelectorAll('.scene');
  let idx = -1;
  items.forEach((it, i) => {
    const end = it.t + it.dur - FADE_OUT_SEC;
    if (time >= it.t && time < end) idx = i;
  });
  scenes.forEach((s, i) => s.classList.toggle('active', i === idx));
  progress.style.width = Math.min(time / total, 1) * 100 + '%';
  counter.textContent = idx >= 0 ? (idx + 1) + ' / ' + items.length : '';
}

function currentTime() {
  if (player.src && !player.paused) return player.currentTime;
  return (performance.now() - startTime) / 1000;
}

function tick() {
  const time = currentTime();
  render(time);
  if (time >= total) {
    stopPlayback();
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    statusEl.textContent = 'শেষ হয়েছে।';
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function play() {
  items = parseScript();
  if (!items.length) { statusEl.textContent = 'লেখা কিছু নেই। আগে লেখা দাও।'; return; }
  const last = items[items.length - 1];
  total = last.t + last.dur + 1;

  buildScenes();
  render(0);
  startTime = performance.now();
  if (player.src) {
    player.currentTime = 0;
    player.play().catch(() => {});
  }
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
  statusEl.textContent = 'চলছে...';
}

function stopPlayback() {
  cancelAnimationFrame(rafId);
  player.pause();
}

async function startRecording() {
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
  } catch (e) {
    statusEl.textContent = 'রেকর্ড শুরু করা গেল না: ' + e.message;
    return;
  }
  chunks = [];
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  recorder = new MediaRecorder(screenStream, { mimeType: mime });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'motion-video.webm';
    a.click();
    screenStream.getTracks().forEach(t => t.stop());
    statusEl.textContent = 'ভিডিও ডাউনলোড হয়েছে (WebM)। MP4 লাগলে কনভার্ট করো।';
  };
  recorder.start();
  statusEl.textContent = 'রেকর্ড হচ্ছে... (শেয়ার উইন্ডোতে "This tab" আর "Share tab audio" বেছে নাও)';
  play();
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  stopPlayback();
  statusEl.textContent = 'থামানো হয়েছে।';
}

playBtn.addEventListener('click', play);
recBtn.addEventListener('click', startRecording);
stopBtn.addEventListener('click', stopRecording);
</script>
</body>
</html>
